<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress | Cart</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-utensils"></i>
            FoodExpress
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="cart.html">Cart</a>
        </nav>

        <div class="icons">
            <span id="welcomeUser" class="welcome-user"></span>
            <a href="login.html" id="authButton">
                <button>Login</button>
            </a>
        </div>
    </header>

    <section class="categories" style="margin-top:100px;">
        <h2>Your Cart 🛒</h2>

        <div class="cart-wrapper">
            <div id="cart-container"></div>

            <div class="bill-box">
                <h2>Order Summary</h2>

                <p>
                    Sub Total:
                    <span id="subtotal">₹0</span>
                </p>

                <p>
                    Delivery Charge:
                    <span>₹40</span>
                </p>

                <p>
                    GST (5%):
                    <span id="gst">₹0</span>
                </p>

                <hr>

                <h3>
                    Total:
                    <span id="total-price">₹0</span>
                </h3>

                <button id="proceedToCheckoutBtn" class="checkout-btn">
                    Proceed To Checkout
                </button>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 FoodExpress | Designed by Abhishek Raj</p>
    </footer>

    <script src="config.js"></script>
    <script src="cart.js"></script>
    <script src="auth-ui.js"></script>

</body>

</html>
