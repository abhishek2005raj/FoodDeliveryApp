<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-utensils"></i>
        FoodExpress
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="login-section">
    <div class="login-box">
        <div class="auth-form" id="loginForm">
            <h2>Welcome Back 👋</h2>
            <p class="auth-subtitle">Login to continue ordering.</p>

            <input type="email" id="loginEmail" placeholder="Enter Email" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Enter Password" autocomplete="current-password">

            <button id="loginBtn">Login</button>

            <p>
                Don't have an account?
                <a href="#" id="showSignup">Sign Up</a>
            </p>
        </div>

        <div class="auth-form" id="signupForm" style="display:none;">
            <h2>Create Account ✨</h2>
            <p class="auth-subtitle">Create your FoodExpress account.</p>

            <input type="text" id="signupName" placeholder="Full Name" autocomplete="name">
            <input type="email" id="signupEmail" placeholder="Enter Email" autocomplete="email">
            <input type="password" id="signupPassword" placeholder="Create Password" autocomplete="new-password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password">

            <button id="signupBtn">Sign Up</button>

            <p>
                Already have an account?
                <a href="#" id="showLogin">Login</a>
            </p>
        </div>

        <p class="auth-message" id="authMessage"></p>
    </div>
</section>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
